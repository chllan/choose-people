<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7eef8">
<title>喵喵大師尋寶｜神祕翻牌</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;color:#342943;background:#f7eef8;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}.app{max-width:1680px;margin:auto;padding:clamp(12px,1.5vw,24px);min-height:100vh}.header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:15px}.header h1{font-size:clamp(25px,2.5vw,44px);margin:0}.sub{color:#776786;font-size:clamp(13px,1.1vw,18px)}.tag{padding:9px 16px;background:white;border-radius:30px;font-weight:750;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(0,1.52fr) minmax(340px,.9fr);gap:18px;align-items:start}.panel{background:#fff;border:1px solid #ecdeec;border-radius:22px;padding:clamp(14px,1.5vw,24px);box-shadow:0 5px 25px #53385a0e}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:14px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:14px;color:#695874;font-weight:750}select,.input{border:2px solid #e7d8eb;background:#fff;border-radius:12px;padding:10px 13px;font-weight:700;min-height:45px;color:#342943}.field select{min-width:160px}.spacer{flex:1}.count{font-size:clamp(16px,1.3vw,22px);font-weight:800;color:#784584}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(9px,1vw,15px)}.grid.five{grid-template-columns:repeat(5,minmax(0,1fr))}.card{min-height:clamp(95px,16.5vh,180px);border:2px solid #ffffffaa;border-radius:17px;color:#654765;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:850;transition:transform .12s,box-shadow .12s;box-shadow:inset 0 -7px #00000008,0 4px 12px #3927440b}.card:not(:disabled):hover{transform:translateY(-3px);box-shadow:0 7px 17px #3927441c}.card:focus-visible{outline:4px solid #693cb5;outline-offset:3px}.card .paw{font-size:clamp(27px,3vw,48px);line-height:1}.card .q{font-size:clamp(19px,2.3vw,31px)}.card .number{font-size:clamp(12px,1.15vw,17px)}.card.used{background:#f1eff3!important;color:#928b97;border-color:#e9e4eb;box-shadow:none}.card.used .paw{font-size:clamp(21px,2.4vw,34px)}.notice{margin-top:15px;color:#73657d;font-size:clamp(13px,1.05vw,16px)}h2{font-size:clamp(19px,1.6vw,26px);margin:0 0 14px}.records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;max-height:min(72vh,800px);overflow-y:auto;padding:2px}.record{background:#faf6fc;border:2px solid #f0e7f3;border-radius:13px;padding:11px;min-height:78px;text-align:left;color:#43344e}.record.active{border-color:#b18ac8;background:#f6ecfc}.record strong{display:block;font-size:clamp(14px,1.05vw,18px)}.record small{display:block;margin-top:6px;color:#87778e;font-size:clamp(12px,.85vw,14px)}.record .done{color:#6b368a}.record .empty{color:#a19aab}.btn{border:0;border-radius:13px;background:#7841a4;color:#fff;font-weight:800;padding:12px 19px;min-height:46px}.btn.secondary{background:#f0e8f5;color:#6c427f}.btn.outline{border:2px solid #e4d5eb;background:#fff;color:#6c427f}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.buttons .btn{flex:1}.setup{max-width:680px;margin:7vh auto 0;text-align:center}.setup h2{font-size:clamp(28px,3vw,48px)}.setup p{color:#766782}.stepper{display:flex;align-items:center;justify-content:center;gap:25px;margin:30px auto}.stepper .btn{font-size:25px;min-width:65px}.stepper output{font-size:clamp(48px,6vw,84px);font-weight:900;min-width:150px}.range{width:90%;accent-color:#7841a4}.legend{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;margin:20px 0}.legend span{border-radius:10px;background:#f6eff9;padding:8px 12px;font-weight:750}.overlay{position:fixed;inset:0;background:#2a1639b8;z-index:20;display:flex;justify-content:center;align-items:center;padding:18px}.reveal{width:min(780px,94vw);background:#fff5fa;border:9px solid white;border-radius:32px;padding:clamp(22px,4vw,55px);text-align:center;box-shadow:0 25px 100px #15081d77}.reveal .emoji{font-size:clamp(50px,8vh,95px)}.reveal h2{font-size:clamp(24px,3vw,40px);color:#825472}.reveal .topic{font-size:clamp(32px,4.5vw,64px);font-weight:950;color:#a33369;line-height:1.2;margin:22px 0 5px}.reveal .person{font-size:clamp(27px,3vw,46px);font-weight:850;color:#643c63;margin:12px 0 28px}.reveal .btn{font-size:clamp(18px,1.6vw,25px);padding:17px 30px}.foot{font-size:13px;color:#93849b;margin-top:10px}.current{font-weight:800;color:#75438e}.pill{display:inline-block;background:#eee5f5;color:#75438e;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800}.setting-note{font-size:14px;color:#78677f;line-height:1.7}.hidden{display:none!important}
@media (max-width:920px){.layout{grid-template-columns:1fr}.records{max-height:none}.header{align-items:flex-start}.card{min-height:110px}.grid.five .card{min-height:92px}.app{padding:12px}}@media (min-width:1050px) and (max-height:790px){.app{padding:12px 18px}.header{margin-bottom:8px}.panel{padding:13px}.toolbar{margin-bottom:9px}.card{min-height:clamp(85px,15vh,130px)}.grid{gap:8px}.records{max-height:65vh;gap:7px}.record{min-height:65px;padding:8px}.buttons{margin-top:10px}}@media (max-width:500px){.grid.five{grid-template-columns:repeat(3,minmax(0,1fr))}.record{min-height:68px;padding:9px}.header h1{font-size:25px}}@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main class="app">
  <header class="header"><div><h1>🐱 喵喵大師尋寶</h1><div class="sub">神祕翻牌・三大課文主題・教室互動遊戲</div></div><span class="tag" id="headCount">自由設定組數</span></header>
  <section id="setup" class="panel setup"><h2>今天有幾組學生？</h2><p>依照實際到場組數設定，每組翻一張牌。</p><div class="stepper"><button class="btn secondary" id="minus" aria-label="減少一組">−</button><output id="groupOutput">9 組</output><button class="btn secondary" id="plus" aria-label="增加一組">＋</button></div><input class="range" id="groupRange" type="range" min="1" max="15" value="9" aria-label="設定學生組數"><div class="legend"><span>🌟 抗萎天使</span><span>🩺 把醫療帶回家鄉</span><span>🌳 為未來種下一座森林</span></div><p class="setting-note">主題會盡可能平均分配，例如 6 組各 2 組、9 組各 3 組。</p><button class="btn" id="start" style="width:min(420px,100%);font-size:22px">開始抽牌 →</button></section>
  <section id="game" class="layout hidden">
   <div class="panel"><div class="toolbar"><div class="field"><label for="groupSelect">目前抽牌組別</label><select id="groupSelect"></select></div><div class="spacer"></div><div class="count" id="progress">已抽 0/9 組</div></div><div class="grid" id="cardGrid" aria-label="神祕翻牌區"></div><div class="notice" id="instruction" role="status">請選擇一張還沒翻過的牌。</div><div class="buttons"><button class="btn outline" id="fullscreen">⛶ 全螢幕</button><button class="btn secondary" id="copy">複製分組名單</button><button class="btn secondary" id="restart">重新設定組數</button></div></div>
   <aside class="panel"><h2>📋 各組抽牌紀錄</h2><div class="records" id="records"></div><div class="foot">✓ 已抽取的組別不會重複抽牌。結果只儲存在目前裝置的瀏覽器中。</div></aside>
  </section>
</main>
<div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="revealTitle"><div class="reveal"><div class="emoji" id="revealEmoji">🐱</div><h2 id="revealTitle">第 1 組抽到的主題</h2><div class="topic" id="revealTopic"></div><div class="person" id="revealPerson"></div><button id="closeReveal" class="btn">下一組繼續抽牌 →</button></div></div>
<script>
(()=>{'use strict';
const KEY='meow_master_flip_v1';
const THEMES=[{title:'抗萎天使',name:'楊媛甯',emoji:'🌟'},{title:'把醫療帶回家鄉',name:'徐超斌醫師',emoji:'🩺'},{title:'為未來種下一座森林',name:'賴倍元',emoji:'🌳'}];
const COLORS=['#f1b3c6','#f5d68b','#b0d8bb','#b6cdef','#cfb8e8','#edb895','#a7d8d3','#ebbadf','#c5dca0','#eec89e','#b7d0ef','#d8b6d6','#c9dc9f','#f0bbbc','#b0d9d3'];
const $=id=>document.getElementById(id);let state={started:false,count:9,current:1,cards:[],results:{},reveal:null};
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Number.isInteger(saved.count)&&saved.count>=1&&saved.count<=15&&Array.isArray(saved.cards)&&saved.cards.length===saved.count&&saved.cards.every(c=>Number.isInteger(c)&&c>=0&&c<3)&&saved.results&&typeof saved.results==='object'){state=saved;state.current=Math.min(state.count,Math.max(1,Number(state.current)||1));state.reveal=null}}catch(e){}}
function availableGroups(){return Array.from({length:state.count},(_,i)=>i+1).filter(g=>!state.results[g])}
function updateSetup(){ $('groupOutput').textContent=state.count+' 組';$('groupRange').value=state.count;$('minus').disabled=state.count===1;$('plus').disabled=state.count===15 }
function render(){ $('setup').classList.toggle('hidden',state.started);$('game').classList.toggle('hidden',!state.started);$('headCount').textContent=state.started?'已抽 '+Object.keys(state.results).length+' / '+state.count+' 組':'自由設定組數';if(!state.started){updateSetup();return}const finished=Object.keys(state.results).length;$('progress').textContent='已抽 '+finished+' / '+state.count+' 組';let opts=Array.from({length:state.count},(_,i)=>{const n=i+1;return '<option value="'+n+'">第 '+n+' 組'+(state.results[n]?' ✓':'')+'</option>'}).join('');$('groupSelect').innerHTML=opts;$('groupSelect').value=state.current;const used=new Set(Object.values(state.results).map(v=>v.card));const grid=$('cardGrid');grid.classList.toggle('five',state.count>=10);grid.innerHTML='';state.cards.forEach((topic,i)=>{const usedCard=used.has(i);let btn=document.createElement('button');btn.type='button';btn.className='card'+(usedCard?' used':'');btn.style.backgroundColor=usedCard?'#f1eff3':COLORS[i%COLORS.length];btn.disabled=usedCard||finished>=state.count||Boolean(state.results[state.current]);btn.setAttribute('aria-label','第 '+(i+1)+' 張牌'+(usedCard?'已抽取':''));btn.innerHTML=usedCard?'<span class="paw">✓</span><span class="number">已翻開</span>':'<span class="paw">🐾</span><span class="q">?</span><span class="number">NO. '+(i+1)+'</span>';btn.addEventListener('click',()=>pick(i));grid.appendChild(btn)});$('instruction').textContent=finished===state.count?'🎉 所有組別都已完成抽牌！':state.results[state.current]?'第 '+state.current+' 組已抽到 '+THEMES[state.results[state.current].topic].name+'，請選擇尚未抽取的組別。':'請第 '+state.current+' 組選擇一張尚未翻開的牌。';$('records').innerHTML='';for(let g=1;g<=state.count;g++){let r=state.results[g],b=document.createElement('button');b.type='button';b.className='record'+(g===state.current?' active':'');b.innerHTML='<strong>第 '+g+' 組 '+(r?'✓':'')+'</strong>'+(r?'<small class="done">'+THEMES[r.topic].name+'</small><small>'+THEMES[r.topic].title+'</small>':'<small class="empty">尚未抽取</small>');b.addEventListener('click',()=>{state.current=g;save();render()});$('records').appendChild(b)}}
function pick(i){if(state.reveal||state.results[state.current]||Object.values(state.results).some(r=>r.card===i))return;const topic=state.cards[i];state.results[state.current]={card:i,topic};state.reveal={group:state.current,topic};save();render();showReveal()}
function showReveal(){if(!state.reveal)return;let r=state.reveal,t=THEMES[r.topic];$('revealEmoji').textContent=t.emoji;$('revealTitle').textContent='第 '+r.group+' 組抽到的主題';$('revealTopic').textContent=t.title;$('revealPerson').textContent=t.name;$('overlay').classList.remove('hidden');$('closeReveal').focus()}
function closeReveal(){state.reveal=null;$('overlay').classList.add('hidden');const next=availableGroups()[0];if(next)state.current=next;save();render()}
function start(){const themes=shuffle(Array.from({length:state.count},(_,i)=>i%3));state={started:true,count:state.count,current:1,cards:themes,results:{},reveal:null};save();render()}
function changeCount(n){state.count=Math.max(1,Math.min(15,n));render()}
$('minus').addEventListener('click',()=>changeCount(state.count-1));$('plus').addEventListener('click',()=>changeCount(state.count+1));$('groupRange').addEventListener('input',e=>changeCount(Number(e.target.value)));$('start').addEventListener('click',start);$('closeReveal').addEventListener('click',closeReveal);$('groupSelect').addEventListener('change',e=>{state.current=Number(e.target.value);save();render()});$('restart').addEventListener('click',()=>{if(!confirm('要重新設定組數嗎？目前的翻牌與分組結果會清除。'))return;state.started=false;state.results={};state.cards=[];state.reveal=null;save();render()});$('copy').addEventListener('click',async()=>{const txt=Array.from({length:state.count},(_,i)=>{const n=i+1,r=state.results[n];return '第 '+n+' 組：'+(r?THEMES[r.topic].title+'——'+THEMES[r.topic].name:'尚未抽取')}).join('\n');try{await navigator.clipboard.writeText(txt);$('instruction').textContent='✅ 已複製分組名單'}catch(e){let a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();$('instruction').textContent='已嘗試複製分組名單'}});$('fullscreen').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.reveal)closeReveal()});load();render();})();
</script>
</body></html>
